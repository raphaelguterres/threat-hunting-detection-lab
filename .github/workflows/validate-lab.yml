name: Validate lab configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Wazuh lab artifacts
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate rules and required artifacts
        shell: pwsh
        run: ./scripts/validate_lab_config.ps1

  m1-offline-hunting:
    name: M1 synthetic hunting contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Report roadmap checklist progress (no operational approval)
        run: python scripts/roadmap_progress.py
      - name: Test roadmap progress accounting
        run: python -m unittest discover -s tests -p test_roadmap_progress.py -v
      - name: Run synthetic M1 offline tests
        run: python -m unittest discover -s tests -p test_hunt_correlations.py -v
      - name: Verify fixture stays synthetic
        run: python scripts/hunt_correlations.py --input tests/fixtures/m1-synthetic.jsonl --fixture
      - name: Check centralized FIM OS scope example (synthetic only)
        run: python scripts/validate_fim_os_scope.py --input tests/fixtures/m1-agent-conf-os-scope-synthetic.xml
      - name: Run offline FIM OS scope guard tests
        run: python -m unittest discover -s tests -p test_fim_os_scope.py -v
      - name: Review synthetic OS-only FIM scope diff
        run: python scripts/review_fim_scope_only.py --original tests/fixtures/m1-original-unscoped-synthetic.xml --proposed tests/fixtures/m1-proposed-scoped-synthetic.xml --fixture
      - name: Run minimal Wazuh agent.conf change guard tests
        run: python -m unittest discover -s tests -p test_review_fim_scope_only.py -v
      - name: Run M1 fail-closed evidence gate contract tests
        run: python -m unittest discover -s tests -p test_m1_evidence_gate.py -v
      - name: Run offline authorized-inventory importer contract tests
        run: python -m unittest discover -s tests -p test_m1_import_authorized_inventory.py -v
      - name: Run FIM OS impact preview offline contracts
        run: python -m unittest discover -s tests -p test_m1_fim_impact_preview.py -v
      - name: Validate M1 operator CSV to private gate end-to-end (synthetic only)
        run: python -m unittest discover -s tests -p test_m1_inventory_end_to_end.py -v
      - name: Check fail-closed triage of partial agent observations (synthetic only)
        run: python -m unittest discover -s tests -p test_m1_observed_agents_triage.py -v
      - name: Run full offline M1 regression suite
        run: python -m unittest discover -s tests -q
      - name: Test bounded H01 retrospective audit
        run: python -m unittest discover -s tests -p test_audit_h01_existing_evidence.py -v
      - name: Run H01 audit on synthetic six-event projection
        run: python scripts/audit_h01_existing_evidence.py --input tests/fixtures/m1-phase3-h01-synthetic.jsonl --fixture
      - name: Smoke-test Windows one-click BAT (synthetic only)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\M1_THREAT_HUNTING.bat --synthetic
